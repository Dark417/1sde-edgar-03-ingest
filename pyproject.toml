[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingest"
version = "0.1.0"
description = "EDGAR -> landing zone: containerized batch CLI (repo 3 of the edgar lakehouse)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dark417" }]

# Exact pins, never ranges. A caret range across five repos means five different
# versions in production and no way to reason about which (AGENTS.global.md law 1).
dependencies = [
    "edgar-lakehouse-contracts==1.1.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "typer>=0.12",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "moto[s3]>=5.0",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[s3,ssm]>=1.34",
]

[project.scripts]
ingest = "ingest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["ingest"]

[[tool.mypy.overrides]]
module = ["moto.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ingest --cov-report=term-missing --cov-fail-under=85"
# Put the repo root on sys.path so `from tests.conftest import ...` resolves.
# `python -m pytest` inserts the cwd and would mask this; the `pytest` console
# script (what CI runs) does not, so without this the suite passes locally and
# fails in CI at collection.
pythonpath = ["."]

[tool.coverage.run]
source = ["src/ingest"]
