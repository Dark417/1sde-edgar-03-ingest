name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  # us-east-2 is not a preference, it is where the Unity Catalog metastore lives.
  # Verified live: `databricks metastores get` returns region us-east-2 and
  # global_metastore_id aws:us-east-2:<METASTORE_ID>. A
  # workspace can only attach to the metastore in its own region, so every bucket
  # and every SSM parameter this repo reads belongs here too. This said us-east-1
  # until 2026-08-01, which would have failed every `ssm get-parameter` with
  # ParameterNotFound the moment AWS was wired up. Do not change it back.
  AWS_REGION: us-east-2
  # Repo 1 publishes no PyPI package, so the pinned contracts wheel has to come
  # from somewhere. Repo 1's `publish` job attaches the wheel to a GitHub release
  # on every v* tag, and repo 1 is public, so the release asset is the source:
  # exact pinned version, no AWS, no credential. See "Obtain the contracts wheel".
  CONTRACTS_REPO: Dark417/1sde-edgar-01-contracts
  # The release tag to install. It must agree with the pyproject pin -- the
  # version guard below fails the build if they drift -- and with repo 2's
  # `contracts_version`, which publishes /edgar-lakehouse/contracts/version as
  # the fleet-wide declaration of what is deployed. All three read v1.4.1; when
  # they disagree, SSM is announcing a version nothing actually runs.
  # If the variable is ever unset, CI falls back to building from repo 1's
  # default branch, which violates "always an exact pinned version"
  # (AGENTS.global.md law 1); the same guard is what keeps that fallback honest.
  CONTRACTS_REF: v1.4.1

permissions:
  contents: read
  id-token: write   # OIDC only. No long-lived AWS keys, ever (design doc §7).

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (Tier-1/Tier-2 leak gate, root AGENTS.md)
        run: bash scripts/secret-scan.sh

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # ---------------------------------------------------------------------
      # Gates that need no dependencies. These run first on purpose: if the
      # contracts wheel cannot be obtained, this job still reports real signal
      # instead of dying at `uv pip install` having checked nothing.
      # ---------------------------------------------------------------------
      - name: ruff
        run: uvx ruff check src tests

      - name: ruff format
        run: uvx ruff format --check src tests

      # Redundant with tests/test_contract_compat.py, but grep-able and
      # merciless is the point (global law 9): a forbidden dep must fail CI
      # even if someone deletes the test.
      - name: forbidden dependencies
        run: |
          if grep -rEn '^\s*(import|from)\s+(pyspark|pandas|requests|databricks)\b' src/; then
            echo "::error::forbidden dependency imported (AGENTS.md §3)"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Obtain the contracts wheel.
      #
      # Repo 1 is public and its `publish` job attaches the wheel to a GitHub
      # release on every v* tag, so the release asset is the source of truth: an
      # exact pinned version, no AWS, no credential, no SSM parameter. This used
      # to read `/edgar-lakehouse/s3/wheels_prefix`, a parameter repo 2 never
      # actually publishes -- the S3 path could not have worked as written.
      #
      # CONTRACTS_REF (repository variable) names the release tag; if it is ever
      # unset, CI falls back to building from repo 1's default branch. That
      # fallback violates "pin an exact version" (global law 1); the version
      # guard below is what keeps it honest either way.
      # ---------------------------------------------------------------------
      - name: Download the pinned contracts wheel from repo 1's release
        if: env.CONTRACTS_REF != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          echo "fetching contracts ${CONTRACTS_REF} from ${CONTRACTS_REPO} releases"
          gh release download "$CONTRACTS_REF" \
            --repo "$CONTRACTS_REPO" \
            --pattern 'edgar_lakehouse_contracts-*.whl' \
            --dir wheels

      - name: Check out repo 1
        if: env.CONTRACTS_REF == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTRACTS_REPO }}
          path: .contracts-src

      - name: Build the contracts wheel from repo 1 source
        if: env.CONTRACTS_REF == ''
        run: |
          mkdir -p wheels
          echo "::warning::CONTRACTS_REF is unset, so the contracts wheel is being built from ${CONTRACTS_REPO}@<default branch> rather than a pinned release. Tag repo 1 and set the CONTRACTS_REF repository variable."
          uv build --wheel --out-dir wheels .contracts-src

      # Fail loudly and actionably rather than with an opaque resolver error.
      - name: Verify the contracts wheel is present
        run: |
          mkdir -p wheels
          PIN=$(grep -oE 'edgar-lakehouse-contracts==[0-9.]+' pyproject.toml | cut -d= -f3)
          if ! ls wheels/edgar_lakehouse_contracts-*.whl >/dev/null 2>&1; then
            echo "::error::Cannot obtain edgar-lakehouse-contracts==${PIN}."
            echo "It is not on PyPI. The source used was:"
            echo "  ${CONTRACTS_REPO} @ ${CONTRACTS_REF:-<default branch, CONTRACTS_REF unset>}"
            exit 1
          fi
          # The pin is the contract; a wheel that does not match it is drift,
          # not a convenience (AGENTS.global.md law 1).
          if ! ls wheels/edgar_lakehouse_contracts-${PIN}-*.whl >/dev/null 2>&1; then
            echo "::error::wheels/ has no edgar_lakehouse_contracts ${PIN} wheel; found:"
            ls -1 wheels/
            exit 1
          fi

      - name: Install
        run: |
          uv venv
          uv pip install --find-links wheels -e ".[dev]"

      # Call the venv binaries directly, NOT `uv run`: `uv run` re-resolves the
      # project's dependencies against the package index, which cannot satisfy
      # the contracts pin (it is only in wheels/ via --find-links) and fails
      # even after a successful install.
      - name: mypy --strict
        run: .venv/bin/mypy

      # Coverage gate (>=85%) and the network ban are enforced inside pytest:
      # every request is served by respx from committed fixtures.
      - name: pytest
        run: .venv/bin/pytest

  # Publishing the container is opt-in: it needs repo 2 applied (ECR repo, ECS task
  # family and the SSM parameters that name them) plus an OIDC role to assume. Set the
  # repository variable AWS_OIDC_ROLE_ARN and this job lights up on the next push to
  # main. Until then it skips, so an unprovisioned account reads as "not deployed yet"
  # rather than as a broken build.
  image:
    needs: quality
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.AWS_OIDC_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Same source as the quality job -- repo 1's release asset, or a source build
      # while repo 1 is untagged. The image must contain the identical wheel the
      # tests ran against, so these two steps must stay in sync with that job.
      - name: Obtain the contracts wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          if [ -n "$CONTRACTS_REF" ]; then
            gh release download "$CONTRACTS_REF" \
              --repo "$CONTRACTS_REPO" \
              --pattern 'edgar_lakehouse_contracts-*.whl' \
              --dir wheels
          else
            git clone --depth 1 "https://github.com/${CONTRACTS_REPO}.git" .contracts-src
            uv build --wheel --out-dir wheels .contracts-src
          fi

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push by digest
        id: build
        run: |
          ECR=$(aws ssm get-parameter --name /edgar-lakehouse/ecr/ingest_repo \
            --query Parameter.Value --output text)
          docker build -t "$ECR:${GITHUB_SHA::12}" .
          # ECR tag immutability makes a rerun of the same commit unable to
          # push: the rebuild is not byte-identical, so the tag rejects it.
          # The image already in ECR for this commit is the artifact of
          # record -- take its digest instead of failing the rerun.
          if docker push "$ECR:${GITHUB_SHA::12}"; then
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR:${GITHUB_SHA::12}")
          else
            SHA=$(aws ecr describe-images --repository-name "${ECR##*/}" \
              --image-ids imageTag="${GITHUB_SHA::12}" \
              --query 'imageDetails[0].imageDigest' --output text)
            [ "$SHA" != "None" ] && [ -n "$SHA" ] || { echo "::error::push failed and no existing image for this tag"; exit 1; }
            DIGEST="${ECR}@${SHA}"
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          # BOOTSTRAP ONLY -- this push succeeds exactly once, ever.
          #
          # Repo 2 creates the ECR repository with image_tag_mutability = IMMUTABLE
          # (deliberately: a digest pin means nothing if the tag behind it can be
          # re-pointed). So `latest` belongs permanently to the first image that
          # claimed it, and every later push here fails and is swallowed. The
          # warning in the log is expected, not a regression.
          #
          # It is still needed. Repo 2's task definition falls back to `:latest`
          # when no digest is supplied, which is the only thing that can work on
          # the very first apply, when ECR is empty and no digest exists yet.
          #
          # The consequence to know: `:latest` is now the STALEST image in the
          # registry, not the newest. Nothing routine reads it -- the step below
          # registers a revision pinned to this build's digest, the scheduler
          # targets the family without a revision so it takes that newest
          # revision, and repo 2's tag-based revision sits underneath unused. But
          # if Terraform ever replaces the task definition, its new revision
          # becomes the newest and quietly runs the bootstrap image. It pulls
          # fine; it is simply old code. Re-run this job to correct it.
          docker tag "$ECR:${GITHUB_SHA::12}" "$ECR:latest"
          docker push "$ECR:latest" || echo "::notice::could not update :latest -- expected, the ECR repo is IMMUTABLE and the tag is bootstrap-only. This build is deployed via the digest-pinned revision registered below."

      # Image size is a gate, not a nice-to-have: this container runs for ~90
      # seconds and a fat image is pure cold-start cost (AGENTS.md §6 F-6).
      - name: Image size budget
        run: |
          ECR=$(aws ssm get-parameter --name /edgar-lakehouse/ecr/ingest_repo \
            --query Parameter.Value --output text)
          SIZE_MB=$(docker image inspect "$ECR:${GITHUB_SHA::12}" \
            --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 250 ]; then
            echo "::error::image is ${SIZE_MB} MB, budget is 250 MB"
            exit 1
          fi

      - name: Update the ECS task definition
        run: |
          TASK_FAMILY=$(aws ssm get-parameter --name /edgar-lakehouse/ecs/task_family \
            --query Parameter.Value --output text)
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' > task-def.json
          python - <<'EOF'
          import json
          import os
          with open("task-def.json") as fh:
              task = json.load(fh)
          task["containerDefinitions"][0]["image"] = os.environ["DIGEST"]
          for key in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                      "compatibilities", "registeredAt", "registeredBy"):
              task.pop(key, None)
          with open("task-def.json", "w") as fh:
              json.dump(task, fh)
          EOF
          aws ecs register-task-definition --cli-input-json file://task-def.json
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
